plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hvs.webstore'
version = '0.0.1-SNAPSHOT'
description = 'Backend do projeto e de webstore HVS'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' //JPA - Hibernate
	implementation 'org.springframework.boot:spring-boot-starter-security' //Security
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' //OAUTH 2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' //OAUTH 2
	implementation 'io.vavr:vavr:0.10.7' //Either
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6' //Swagger
	testImplementation 'org.json:json:20240303'
	testImplementation 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register("pDev") {
	group = "application"
	description = "Runs the Spring Boot application with the dev profile"
	doFirst {
		tasks.bootRun.configure {
			systemProperty("spring.profiles.active", "dev")
		}
		apply from: 'build-dev.gradle'
	}
	finalizedBy("bootRun")
}

tasks.register("pProd") {
	group = "application"
	description = "Runs the Spring Boot application with the prod profile"
	doFirst {
		tasks.bootRun.configure {
			systemProperty("spring.profiles.active", "prod")
		}
		apply from: 'build-prod.gradle'
	}
	finalizedBy("bootRun")
}

tasks.register("pTest") {
	group = "application"
	description = "Runs the Spring Boot application with the test profile"
	doFirst {
		tasks.bootRun.configure {
			systemProperty("spring.profiles.active", "test")
		}
		apply from: 'build-test.gradle'
	}
	finalizedBy("bootRun")
}

tasks.register("scanCortes", JavaExec) {
	group = "detection"
	description = "Scans all episodes and saves intros, endings and commercials to corte table"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.hvs.webstore.back.EscanearESalvarCortes"
}

tasks.register("buscarCapas", JavaExec) {
	group = "util"
	description = "Fetches cover images from TMDB for programs without a capa_url"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.hvs.webstore.back.util.BuscarCapasProgramas"
}
